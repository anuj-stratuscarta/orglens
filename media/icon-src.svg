<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf7"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <clipPath id="lensClip"><circle cx="168" cy="158" r="44"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="#ffffff" opacity=".06"/>
  <!-- document -->
  <g filter="url(#sh)">
    <path d="M58 44h92l42 42v122a12 12 0 0 1-12 12H58a12 12 0 0 1-12-12V56a12 12 0 0 1 12-12z" fill="url(#paper)"/>
    <path d="M150 44v30a12 12 0 0 0 12 12h30z" fill="#c7d4ea"/>
  </g>
  <!-- flame chart bars -->
  <rect x="64" y="96" width="110" height="14" rx="4" fill="#3b82f6"/>
  <rect x="70" y="116" width="58" height="14" rx="4" fill="#10b981"/>
  <rect x="132" y="116" width="36" height="14" rx="4" fill="#f59e0b"/>
  <rect x="76" y="136" width="28" height="14" rx="4" fill="#ef4444"/>
  <rect x="108" y="136" width="18" height="14" rx="4" fill="#8b5cf6"/>
  <rect x="64" y="166" width="54" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="64" y="182" width="38" height="7" rx="3.5" fill="#cbd5e1"/>
  <!-- magnifier -->
  <g filter="url(#sh)">
    <line x1="200" y1="190" x2="226" y2="216" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <line x1="200" y1="190" x2="226" y2="216" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="168" cy="158" r="44" fill="#0f172a" fill-opacity=".55"/>
